<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <!-- Top Rim Gradient -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9333ea" />
      <stop offset="45%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>

    <!-- Upper Body Right Facet Gradient -->
    <linearGradient id="upperRightGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <!-- Lower Body Right Facet Gradient -->
    <linearGradient id="lowerRightGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <!-- Base Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#6366f1" flood-opacity="0.35" />
    </filter>
  </defs>

  <g filter="url(#glow)">
    <!-- 1. Pedestal Base -->
    <polygon points="66,120 22,106 66,93 110,104" fill="#141c3d" stroke="#3b82f6" stroke-width="1.2" stroke-linejoin="round" />

    <!-- 2. Lower Body (Tapered Neck) -->
    <!-- Lower Left Facet -->
    <polygon points="36,68 67,80 67,105 53,98" fill="#2563eb" />
    <!-- Lower Right Facet -->
    <polygon points="67,80 106,53 80,95 67,105" fill="url(#lowerRightGrad)" />

    <!-- 3. Upper Body -->
    <!-- Upper Left Facet -->
    <polygon points="17,34 67,52 67,80 36,68" fill="#1e293b" />
    <!-- Upper Right Facet -->
    <polygon points="67,52 115,28 106,53 67,80" fill="url(#upperRightGrad)" />

    <!-- 4. Top Rim & Cavity -->
    <!-- Inner Cavity -->
    <polygon points="64,28 38,36 67,46 93,34" fill="#172453" />
    <!-- Outer Rim -->
    <path d="M64,10 L17,34 L67,52 L115,28 Z M64,28 L93,34 L67,46 L38,36 Z" fill="url(#rimGrad)" fill-rule="evenodd" />
  </g>
</svg>
